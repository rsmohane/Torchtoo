version: '3.8'

services:
  # MSSQL Server
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: grt-mssql
    environment:
      SA_PASSWORD: "GrtBearer@2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - grt-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "GrtBearer@2024!" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (.NET)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grt-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=mssql,1433;Initial Catalog=GrtTorchBearer;User Id=sa;Password=GrtBearer@2024!;
      - Jwt__Secret=your-super-secret-jwt-key-min-32-chars-change-in-production
      - Encryption__Key=your-encryption-key-min-32-chars-for-aes
    ports:
      - "5000:5000"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grt-network
    healthcheck:
      test: curl --fail http://localhost:5000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Website (React)
  frontend:
    build:
      context: ./frontend/grt-website
      dockerfile: Dockerfile
    container_name: grt-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - grt-network

  # Admin Dashboard (React)
  admin:
    build:
      context: ./frontend/grt-admin
      dockerfile: Dockerfile
    container_name: grt-admin
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - grt-network

  # Marketplace (React)
  marketplace:
    build:
      context: ./frontend/grt-marketplace
      dockerfile: Dockerfile
    container_name: grt-marketplace
    ports:
      - "3002:3000"
    environment:
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - grt-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: grt-redis
    ports:
      - "6379:6379"
    networks:
      - grt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mssql_data:

networks:
  grt-network:
    driver: bridge
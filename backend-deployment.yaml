apiVersion: apps/v1
kind: Deployment
metadata:
  name: grt-backend
  labels:
    app: grt-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: grt-backend
  template:
    metadata:
      labels:
        app: grt-backend
    spec:
      containers:
      - name: grt-backend
        image: grtgroup2000-code/grt-torch-bearer-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: grt-secrets
              key: database-connection
        - name: Jwt__Secret
          valueFrom:
            secretKeyRef:
              name: grt-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: grt-backend-service
spec:
  selector:
    app: grt-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: LoadBalancer